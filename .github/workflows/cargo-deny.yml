name: cargo-deny

# Supply-chain + license gate. Runs without compiling the project, so it's
# fast and independent of the platform build matrix.
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  cargo-deny:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - uses: EmbarkStudios/cargo-deny-action@v2.1.2
        with:
          command: check advisories licenses sources bans
