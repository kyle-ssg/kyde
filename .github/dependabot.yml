version: 2
updates:
  # Rust crate dependencies.
  - package-ecosystem: cargo
    directory: "/"
    schedule:
      interval: weekly
    open-pull-requests-limit: 10
    groups:
      # tree-sitter core + grammars must move together (ABI alignment), so
      # batch them into one PR instead of a dozen conflicting ones.
      tree-sitter:
        patterns:
          - "tree-sitter*"
      objc2:
        patterns:
          - "objc2*"

  # GitHub Actions used in workflows.
  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: weekly
    ignore:
      # dtolnay/rust-toolchain's tag IS the Rust toolchain version, and ours is pinned to
      # the MSRV (see rust-version in Cargo.toml) on purpose — a dependabot "bump" would
      # silently raise the MSRV job's toolchain (and once proposed 1.100.0, which doesn't
      # even exist → 404). MSRV bumps are deliberate, manual changes.
      - dependency-name: "dtolnay/rust-toolchain"
